# Self-contained stack for a short demo on a shared server.
#
#   ./demo-up.sh      build, start, load demo data, print the address and accounts
#   ./demo-down.sh    stop and delete everything the demo created
#
# Differences from docker-compose.yml: plain HTTP, a single published port
# (DEMO_PORT, default 8080), no fixed container names, its own volumes - so it can
# run next to other projects without touching ports 80/443/8000/5433.

name: sqlp-demo

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sql_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./demo-up.sh - it creates .env.demo}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    networks:
      - app

  backend:
    build:
      context: ./backend
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?run ./demo-up.sh - it creates .env.demo}
      DB_NAME: sql_learning
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${DEMO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: http://localhost
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run ./demo-up.sh - it creates .env.demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_HTTPS: "False"
      SANDBOX_POOL_START: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - demo_static:/app/staticfiles
      - demo_media:/app/media
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      sandbox-postgres:
        condition: service_healthy
      sandbox-mariadb:
        condition: service_healthy
      sandbox-mongodb:
        condition: service_healthy
      sandbox-redis:
        condition: service_healthy
      session-redis:
        condition: service_healthy
    logging: *logging
    networks:
      - app
      - sandbox

  web:
    build:
      context: ./frontend
      args:
        # Empty on purpose: the bundle then calls the API on the address it was opened at.
        VITE_API_URL: ""
    ports:
      - "${DEMO_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - demo_static:/app/staticfiles:ro
      - demo_media:/app/media:ro
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    networks:
      - app

  # The backend looks sandboxes up by the container names of the main compose file;
  # the aliases give these containers the same names inside the demo network only.
  sandbox-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
    volumes:
      - ./docker/sandbox-postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks:
      sandbox:
        aliases:
          - sql-sandbox-postgres

  sandbox-mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: sandbox
      MARIADB_USER: sandbox
      MARIADB_PASSWORD: sandbox
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - ./docker/sandbox-mariadb-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks:
      sandbox:
        aliases:
          - sql-sandbox-mariadb

  sandbox-mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: sandbox
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks:
      sandbox:
        aliases:
          - sql-sandbox-mongodb

  sandbox-redis:
    image: redis:7-alpine
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks:
      sandbox:
        aliases:
          - sql-sandbox-redis

  session-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - demo_session_redis:/data
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks:
      sandbox:
        aliases:
          - sql-session-redis

networks:
  app:
  sandbox:

volumes:
  demo_postgres_data:
  demo_static:
  demo_media:
  demo_session_redis:
