# Host-nginx site for a stack started from docker-compose.server.yml.
# Replace APP_HOST and APP_PORT (the values from .env.server), put the file in
# /etc/nginx/sites-available, link it into sites-enabled, then let certbot add TLS:
#   certbot --nginx -d APP_HOST --redirect

upstream sqlp_APP_PORT {
    server 127.0.0.1:APP_PORT;
}

server {
    listen 80;
    server_name APP_HOST;

    access_log /var/log/nginx/APP_HOST.access.log;
    error_log  /var/log/nginx/APP_HOST.error.log;

    client_max_body_size 10m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django admin: keep it to a list of trusted addresses when the server has one, e.g.
    #   include /etc/nginx/snippets/vpn-whitelist.conf;
    location /admin/ {
        proxy_pass http://sqlp_APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login and registration get a per-address request limit on top of the application's
    # own limits; the zone must exist in nginx.conf (http block), e.g.
    #   limit_req_zone $binary_remote_addr zone=app_login:10m rate=3r/s;
    location ~ ^/api/auth/(login|register)/$ {
        limit_req zone=app_login burst=10 nodelay;
        proxy_pass http://sqlp_APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://sqlp_APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
