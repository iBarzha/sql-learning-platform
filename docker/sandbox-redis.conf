# Redis sandbox for student commands (docker-compose.server.yml).
# Defense in depth behind the command whitelist in sandbox/query_validator.py:
# administrative and scripting commands do not exist on this server at all.

bind 0.0.0.0
protected-mode no
save ""
appendonly no
maxmemory 48mb
maxmemory-policy noeviction

rename-command CONFIG ""
rename-command DEBUG ""
rename-command MODULE ""
rename-command SHUTDOWN ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command BGREWRITEAOF ""
rename-command LASTSAVE ""
rename-command CLUSTER ""
rename-command SCRIPT ""
rename-command EVAL ""
rename-command EVALSHA ""
rename-command EVAL_RO ""
rename-command EVALSHA_RO ""
rename-command FUNCTION ""
rename-command FCALL ""
rename-command FCALL_RO ""
rename-command ACL ""
rename-command MIGRATE ""
rename-command SYNC ""
rename-command PSYNC ""
rename-command MONITOR ""
